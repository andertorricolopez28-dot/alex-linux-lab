function nodeDir(){
 return {type:"dir",children:{},permissions:"755",modified:Date.now()};
}
function nodeFile(content=""){
 return {type:"file",content:String(content),permissions:"644",modified:Date.now()};
}

const root = nodeDir();

function addPath(path,node){
 const parts = path.split("/").filter(Boolean);
 let current = root;
 for(let i=0;i<parts.length;i++){
  if(i===parts.length-1){
   current.children[parts[i]]=node;
  }else{
   if(!current.children[parts[i]]) current.children[parts[i]]=nodeDir();
   current=current.children[parts[i]];
  }
 }
}

function tokenize(str){
 const result=[];
 const regex=/"([^"]*)"|'([^']*)'|(\S+)/g;
 let match;
 while((match=regex.exec(str))!==null){
  result.push(match[1] ?? match[2] ?? match[3]);
 }
 return result;
}

function normalize(path){
 let parts=[];
 let source=path.startsWith("/")?path:cwd+"/"+path;
 for(const part of source.split("/")){
  if(!part || part===".") continue;
  if(part==="..") parts.pop();
  else parts.push(part);
 }
 return "/"+parts.join("/");
}

function getNode(path){
 if(path==="/") return root;
 let current=root;
 for(const part of path.split("/").filter(Boolean)){
  if(!current || current.type!=="dir") return null;
  current=current.children[part];
 }
 return current || null;
}

function parentInfo(path){
 const clean=normalize(path);
 const parts=clean.split("/").filter(Boolean);
 const name=parts.pop();
 const parent=getNode("/"+parts.join("/"));
 return {parent,name,path:clean};
}

function ensureDir(path){
 const info=parentInfo(path);
 if(!info.parent || info.parent.type!=="dir") return false;
 if(info.parent.children[info.name]) return false;
 info.parent.children[info.name]=nodeDir();
 return true;
}

function getSize(node){
 if(!node) return 0;
 if(node.type==="file") return new TextEncoder().encode(node.content).length;
 return Object.values(node.children).reduce((sum,item)=>sum+getSize(item),0);
}

function listTree(node,path="",prefix=""){
 if(!node || node.type!=="dir") return [];
 let result=[];
 const names=Object.keys(node.children).sort();
 names.forEach((name,index)=>{
  const child=node.children[name];
  const last=index===names.length-1;
  result.push(prefix+(last?"└── ":"├── ")+name+(child.type==="dir"?"/":""));
  if(child.type==="dir"){
   result=result.concat(listTree(child,path+"/"+name,prefix+(last?"    ":"│   ")));
  }
 });
 return result;
}

function cloneNode(node){
 if(node.type==="file") return {...node};
 const copy=nodeDir();
 copy.permissions=node.permissions;
 copy.modified=node.modified;
 for(const [name,child] of Object.entries(node.children)){
  copy.children[name]=cloneNode(child);
 }
 return copy;
}

function deleteNode(path){
 const info=parentInfo(path);
 if(!info.parent || !info.parent.children[info.name]) return false;
 delete info.parent.children[info.name];
 return true;
}

function parseNumber(value){
 const number=Number(value);
 return Number.isFinite(number)?number:null;
}

function safeCalc(expression){
 if(!/^[0-9+\-*/().%\s]+$/.test(expression)) throw Error("Expresion no permitida.");
 const tokens=expression.match(/\d+(?:\.\d+)?|[()+\-*/%]/g);
 if(!tokens || tokens.join("")!==expression.replace(/\s/g,"")) throw Error("Expresion invalida.");
 let pos=0;
 function factor(){
  const token=tokens[pos++];
  if(token==="+") return factor();
  if(token==="-") return -factor();
  if(token==="("){
   const value=expr();
   if(tokens[pos++]!==")") throw Error("Falta cerrar parentesis.");
   return value;
  }
  const value=Number(token);
  if(!Number.isFinite(value)) throw Error("Numero invalido.");
  return value;
 }
 function term(){
  let value=factor();
  while(["*","/","%"].includes(tokens[pos])){
   const op=tokens[pos++];
   const right=factor();
   if((op==="/" || op==="%") && right===0) throw Error("No se puede dividir por cero.");
   if(op==="*") value*=right;
   if(op==="/") value/=right;
   if(op==="%") value%=right;
  }
  return value;
 }
 function expr(){
  let value=term();
  while(tokens[pos]==="+" || tokens[pos]==="-"){
   const op=tokens[pos++];
   const right=term();
   value=op==="+"?value+right:value-right;
  }
  return value;
 }
 const result=expr();
 if(pos!==tokens.length || !Number.isFinite(result)) throw Error("Expresion invalida.");
 return result;
}

function showNode(path){
 const node=getNode(normalize(path));
 if(!node){print("No existe: "+path,"red");return;}
 if(node.type==="dir"){
  print(Object.keys(node.children).join("  ") || "(directorio vacio)");
 }else{
  print(node.content);
 }
}

function walkFind(node,path,pattern,results){
 if(node.type!=="dir") return;
 for(const [name,child] of Object.entries(node.children)){
  const full=path==="/"?"/"+name:path+"/"+name;
  if(name.toLowerCase().includes(pattern.toLowerCase())) results.push(full);
  if(child.type==="dir") walkFind(child,full,pattern,results);
 }
}

async function execute(raw){
 const args=tokenize(raw.trim());
 if(!args.length) return;
 let cmd=args[0].toLowerCase();
 let a=args.slice(1);
 const joined=a.join(" ");

 try{
 switch(cmd){

 case "help": help(); break;
 case "pwd": print(cwd); break;
 case "whoami": print("alex"); break;
 case "id": print("uid=1000(alex) gid=1000(alex) groups=1000(alex),27(sudo)"); break;
 case "hostname": print("alex-linux-lab"); break;
 case "uname":
  print(a[0]==="-a"?"Linux alex-linux-lab 6.8.0-virtual #1 SMP x86_64 GNU/Linux":"Linux");
  break;
 case "date": print(new Date().toString()); break;
 case "uptime": print("Sistema virtual activo desde hace 00:24:18"); break;
 case "clear": terminal.innerHTML=""; break;
 case "history": history.forEach((item,i)=>print((i+1)+"  "+item)); break;
 case "echo": print(a.join(" ").replace(/\$([A-Za-z_][A-Za-z0-9_]*)/g,(_,key)=>variables[key]||"")); break;
 case "env":
  print("USER=alex\nHOME=/home/alex\nSHELL=/bin/alex-shell\nHOSTNAME=alex-linux-lab\nLAB_VERSION=4.0");
  Object.entries(variables).forEach(([k,v])=>print(k+"="+v));
  break;
 case "export":
  if(!a.length){print("Uso: export NOMBRE=valor","red");break;}
  const pair=a.join(" ").match(/^([A-Za-z_]\w*)=(.*)$/);
  if(!pair){print("Formato: export NOMBRE=valor","red");break;}
  variables[pair[1]]=pair[2];
  print("Variable guardada: "+pair[1],"green");
  break;
 case "which":
  print(commands.includes(a[0])?"/usr/bin/"+a[0]:"Comando no encontrado: "+(a[0]||""));
  break;
 case "man": manuals(a[0]); break;

 case "ls":{
  const path=normalize(a[0]||".");
  const node=getNode(path);
  if(!node || node.type!=="dir"){print("Directorio no encontrado","red");break;}
  const names=Object.entries(node.children).map(([name,item])=>item.type==="dir"?name+"/":name);
  print(names.join("    ")||"(vacio)");
  break;
 }
 case "cd":{
  const path=normalize(a[0]||"/home/alex");
  const node=getNode(path);
  if(!node || node.type!=="dir"){print("No es un directorio: "+path,"red");break;}
  cwd=path;
  break;
 }
 case "mkdir":{
  if(!a[0]){print("Uso: mkdir nombre","red");break;}
  const path=normalize(a[0]);
  print(ensureDir(path)?"Directorio creado: "+path:"No se pudo crear. Comprueba la ruta.","green");
  break;
 }
 case "touch":{
  if(!a[0]){print("Uso: touch archivo","red");break;}
  const path=normalize(a[0]);
  const info=parentInfo(path);
  if(!info.parent || info.parent.type!=="dir"){print("Ruta no valida","red");break;}
  if(info.parent.children[info.name]){
   if(info.parent.children[info.name].type==="file") info.parent.children[info.name].modified=Date.now();
   else print("Ya existe un directorio con ese nombre","red");
  }else{
   info.parent.children[info.name]=nodeFile();
   print("Archivo creado: "+path,"green");
  }
  break;
 }
 case "cat":{
  if(!a[0]){print("Uso: cat archivo","red");break;}
  const node=getNode(normalize(a[0]));
  if(!node || node.type!=="file"){print("Archivo no encontrado","red");break;}
  print(node.content);
  break;
 }
 case "write":
 case "append":{
  if(a.length<2){print("Uso: "+cmd+" archivo texto","red");break;}
  const path=normalize(a[0]);
  const info=parentInfo(path);
  if(!info.parent || info.parent.type!=="dir"){print("Ruta no valida","red");break;}
  let node=info.parent.children[info.name];
  if(node && node.type!=="file"){print("No es un archivo","red");break;}
  if(!node) node=info.parent.children[info.name]=nodeFile();
  node.content=cmd==="append"?node.content+(node.content?"\n":"")+a.slice(1).join(" "):a.slice(1).join(" ");
  node.modified=Date.now();
  print("Contenido actualizado: "+path,"green");
  break;
 }
 case "rm":{
  if(!a[0]){print("Uso: rm archivo","red");break;}
  const path=normalize(a[0]);
  const node=getNode(path);
  if(!node){print("No existe","red");break;}
  if(node.type==="dir"){print("Usa rmdir para directorios vacios","red");break;}
  deleteNode(path);
  print("Archivo eliminado: "+path,"green");
  break;
 }
 case "rmdir":{
  const path=normalize(a[0]||"");
  const node=getNode(path);
  if(!node || node.type!=="dir"){print("Directorio no encontrado","red");break;}
  if(Object.keys(node.children).length){print("El directorio no esta vacio","red");break;}
  deleteNode(path);
  print("Directorio eliminado","green");
  break;
 }
 case "cp":
 case "mv":{
  if(a.length<2){print("Uso: "+cmd+" origen destino","red");break;}
  const source=normalize(a[0]), dest=normalize(a[1]);
  const node=getNode(source);
  if(!node || source==="/"){print("Origen no valido","red");break;}
  if(dest===source || dest.startsWith(source+"/")){print("Destino no valido","red");break;}
  const info=parentInfo(dest);
  if(!info.parent || info.parent.type!=="dir"){print("Directorio destino no encontrado","red");break;}
  if(info.parent.children[info.name]){print("El destino ya existe","red");break;}
  info.parent.children[info.name]=cloneNode(node);
  if(cmd==="mv") deleteNode(source);
  print(cmd==="cp"?"Copia creada":"Elemento movido","green");
  break;
 }
 case "tree":{
  const path=normalize(a[0]||".");
  const node=getNode(path);
  if(!node || node.type!=="dir"){print("Directorio no encontrado","red");break;}
  print(path);
  listTree(node).forEach(line=>print(line));
  break;
 }
 case "find":{
  let path="/home/alex",pattern="";
  if(a[0]==="-name"){pattern=a[1]||"";}
  else if(a[1]==="-name"){path=normalize(a[0]);pattern=a[2]||"";}
  else {path=normalize(a[0]||".");pattern=a[1]||"";}
  const node=getNode(path);
  if(!node || node.type!=="dir"){print("Ruta no valida","red");break;}
  if(!pattern){print("Uso: find /ruta -name palabra","red");break;}
  const results=[];
  walkFind(node,path,pattern,results);
  results.length?results.forEach(x=>print(x)):print("Sin resultados");
  break;
 }
 case "grep":{
  if(a.length<2){print("Uso: grep palabra archivo","red");break;}
  const node=getNode(normalize(a[1]));
  if(!node || node.type!=="file"){print("Archivo no encontrado","red");break;}
  const matches=node.content.split("\n").filter(line=>line.toLowerCase().includes(a[0].toLowerCase()));
  matches.length?matches.forEach(line=>print(line)):print("Sin coincidencias");
  break;
 }
 case "head":
 case "tail":{
  const node=getNode(normalize(a[0]||""));
  if(!node || node.type!=="file"){print("Uso: "+cmd+" archivo","red");break;}
  const lines=node.content.split("\n");
  const count=Number(a[1])||5;
  (cmd==="head"?lines.slice(0,count):lines.slice(-count)).forEach(line=>print(line));
  break;
 }
 case "wc":{
  const node=getNode(normalize(a[0]||""));
  if(!node || node.type!=="file"){print("Uso: wc archivo","red");break;}
  const lines=node.content?node.content.split("\n").length:0;
  const words=node.content.trim()?node.content.trim().split(/\s+/).length:0;
  print(lines+" lineas  "+words+" palabras  "+getSize(node)+" bytes");
  break;
 }
 case "stat":{
  const node=getNode(normalize(a[0]||"."));
  if(!node){print("No encontrado","red");break;}
  print("Tipo: "+node.type+"\nPermisos: "+node.permissions+"\nTamaño: "+getSize(node)+" bytes\nModificado: "+new Date(node.modified).toLocaleString());
  break;
 }
 case "du":{
  const path=normalize(a[0]||".");
  const node=getNode(path);
  if(!node){print("Ruta no encontrada","red");break;}
  print(getSize(node)+" bytes  "+path);
  break;
 }
 case "df":{
  const used=getSize(root);
  print("Sistema de archivos virtual");
  print("Total: 100 MB");
  print("Usado: "+(used/1024).toFixed(2)+" KB");
  print("Disponible: "+(102400-used/1024).toFixed(2)+" KB");
  print("Uso: "+(used/1048576*100).toFixed(2)+"%");
  break;
 }
 case "free":{
  print("             TOTAL      USADO      LIBRE");
  print("RAM          4096 MB    1240 MB    2856 MB");
  print("SWAP         2048 MB     120 MB    1928 MB");
  print("Nota: memoria simulada del laboratorio.");
  break;
 }
 case "ps":{
  print("PID   USER      CPU     MEMORIA    PROCESO","green");
  processes.forEach(p=>print(p.pid+"   "+p.user+"   "+p.cpu+"   "+p.memory+"   "+p.name));
  break;
 }
 case "top":{
  print("ALEX SYSTEM MONITOR 4.0","green");
  print("CPU virtual: 12% | RAM virtual: 30% | Procesos: "+processes.length);
  print("PID   PROCESO          CPU       MEMORIA");
  processes.forEach(p=>print(p.pid+"   "+p.name+"   "+p.cpu+"   "+p.memory));
  print("Monitor de demostracion: datos simulados.");
  break;
 }
 case "kill":{
  const pid=Number(a[0]);
  const index=processes.findIndex(p=>p.pid===pid && p.pid!==1);
  if(index<0){print("Proceso no encontrado o protegido","red");break;}
  const name=processes[index].name;
  processes.splice(index,1);
  print("Proceso virtual terminado: "+name,"green");
  break;
 }
 case "chmod":{
  if(a.length<2){print("Uso: chmod 755 archivo","red");break;}
  if(!/^[0-7]{3,
