<div id="launcher" class="section">
  <button onclick="show('home')">← VOLVER</button>

  <h2>🚀 ALEX APP LAUNCHER 21.0</h2>

  <div class="panel">
    <h3>ABRIR APLICACIÓN</h3>
    <p class="muted">
      Escribe el nombre de una aplicación instalada.
    </p>

    <input id="appName"
      placeholder="Ejemplo: Roblox, YouTube, Instagram">

    <button class="full" onclick="launchApp()">
      🚀 EJECUTAR APLICACIÓN
    </button>

    <h3>APLICACIONES RÁPIDAS</h3>

    <div class="grid">
      <button onclick="quickApp('Roblox')">ROBLOX</button>
      <button onclick="quickApp('YouTube')">YOUTUBE</button>
      <button onclick="quickApp('Instagram')">INSTAGRAM</button>
      <button onclick="quickApp('WhatsApp')">WHATSAPP</button>
      <button onclick="quickApp('Chrome')">CHROME</button>
      <button onclick="quickApp('Termux')">TERMUX</button>
    </div>

    <pre id="appOutput">APP LAUNCHER READY...</pre>
  </div>

  <div class="panel">
    <h3>PAQUETE PERSONALIZADO</h3>
    <p class="muted">
      También puedes introducir el identificador Android
      de una aplicación.
    </p>
    <input id="packageName"
      placeholder="Ejemplo: com.spotify.music">

    <button class="full" onclick="launchPackage()">
      ABRIR POR PACKAGE ID
    </button>
  </div>
</div>
