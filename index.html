
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALEX LINUX LAB 3.0</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050b08;color:#d9ffe5;
 font-family:monospace;padding:15px
}
header{text-align:center;padding:20px}
h1{color:#00ff88;text-shadow:0 0 12px #00ff88}
.panel{
 max-width:900px;margin:15px auto;padding:15px;
 background:#0b1710;border:1px solid #17613a;
 border-radius:12px
}
#terminal{
 height:380px;overflow:auto;background:#020604;
 padding:15px;border-radius:8px;
 white-space:pre-wrap;overflow-wrap:anywhere;
 line-height:1.6;font-size:13px
}
.green{color:#00ff88}
.red{color:#ff7777}
.blue{color:#69caff}
.inputrow{display:flex;gap:8px;margin-top:12px}
input{
 flex:1;min-width:0;background:#020604;color:#00ff88;
 border:1px solid #17613a;padding:13px;
 font-family:monospace;border-radius:6px
}
button{
 background:#07532b;color:#00ff88;
 border:1px solid #00a957;border-radius:6px;
 padding:12px;cursor:pointer;font-weight:bold
}
button:active{background:#087c3d}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{font-size:12px}
</style>
</head>
<body>

<header>
<h1>ALEX LINUX LAB 3.0</h1>
<p>LABORATORIO LINUX VIRTUAL</p>
<p class="green">● SISTEMA INICIADO</p>
</header>

<div class="panel">
<h3 class="green">TERMINAL</h3>
<div id="terminal"></div>

<div class="inputrow">
<input id="command" placeholder="Escribe help..." autocomplete="off">
<button id="run">EJECUTAR</button>
</div>
<p style="font-size:11px;color:#83aa90">
Pulsa ENTER para ejecutar un comando.
</p>
</div>

<div class="panel">
<h3 class="green">COMANDOS RÁPIDOS</h3>
<div class="quick">
<button data-command="help">HELP</button>
<button data-command="ls">LS</button>
<button data-command="pwd">PWD</button>
<button data-command="whoami">WHOAMI</button>
<button data-command="neofetch">NEOFETCH</button>
<button data-command="date">DATE</button>
<button data-command="clear">CLEAR</button>
</div>
</div>

<script>
(function(){

const terminal=document.getElementById("terminal");
const input=document.getElementById("command");
const runButton=document.getElementById("run");

if(!terminal || !input || !runButton){
 alert("Error: no se encontró la terminal.");
 return;
}

const files={
 "/home/alex":{
  "welcome.txt":"Bienvenido a ALEX LINUX LAB 3.0",
  "notas.txt":"Aprendiendo Linux paso a paso."
 }
};

let cwd="/home/alex";
let history=[];
let historyPosition=0;

function output(text,color=""){
 const line=document.createElement("div");
 line.textContent=String(text);
 if(color) line.className=color;
 terminal.appendChild(line);
 terminal.scrollTop=terminal.scrollHeight;
}

function prompt(){
 return "alex@linux-lab:"+cwd+"$ ";
}

function resolve(path){
 if(!path || path==="~") return "/home/alex";
 if(path.startsWith("/")) return path.replace(/\/+/g,"/").replace(/\/$/,"") || "/";
 const parts=(cwd+"/"+path).split("/");
 const result=[];
 for(const p of parts){
  if(!p || p===".") continue;
  if(p==="..") result.pop();
  else result.push(p);
 }
 return "/"+result.join("/");
}

function parent(path){
 const p=path.lastIndexOf("/");
 return {
  folder:path.substring(0,p)||"/",
  name:path.substring(p+1)
 };
}

function execute(raw){
 const text=raw.trim();
 if(!text)return;

 output(prompt()+text,"green");
 history.push(text);
 historyPosition=history.length;

 const parts=text.match(/"[^"]*"|'[^']*'|\S+/g)||[];
 const cmd=parts.shift().toLowerCase();
 const args=parts.map(x=>x.replace(/^["']|["']$/g,""));

 try{
 switch(cmd){

 case "help":
 output("===== COMANDOS DISPONIBLES =====","green");
 output("help       Mostrar ayuda");
 output("ls         Listar archivos");
 output("pwd        Mostrar ubicación");
 output("cd         Cambiar directorio");
 output("mkdir      Crear carpeta");
 output("touch      Crear archivo");
 output("cat        Leer archivo");
 output("write      Escribir archivo");
 output("rm         Eliminar archivo");
 output("whoami     Mostrar usuario");
 output("hostname   Nombre del sistema");
 output("uname      Información Linux");
 output("date       Fecha actual");
 output("uptime     Tiempo de sesión");
 output("neofetch   Información visual");
 output("echo       Mostrar texto");
 output("calc       Calculadora");
 output("tree       Árbol de archivos");
 output("clear      Limpiar terminal");
 output("history    Historial");
 break;

 case "pwd":
 output(cwd,"green");
 break;

 case "whoami":
 output("alex","green");
 break;

 case "hostname":
 output("alex-linux-lab");
 break;

 case "uname":
 output(args[0]==="-a"?
 "Linux alex-linux-lab 6.0.0-virtual x86_64 GNU/Linux":
 "Linux");
 break;

 case "date":
 output(new Date().toString());
 break;

 case "uptime":
 output("Sesión activa: "+Math.floor(performance.now()/1000)+" segundos");
 break;

 case "neofetch":
 output("       .---.       alex@linux-lab","green");
 output("      /     \\      ----------------");
 output("     | () () |     OS: Alex Linux Lab 3.0");
 output("      \\  ^  /      Kernel: Virtual");
 output("       |||||       Shell: AlexShell");
 output("       |||||       User: alex");
 break;

 case "ls":{
 const path=resolve(args[0]||".");
 if(!files[path]){
  output("No existe el directorio: "+path,"red");break;
 }
 const names=Object.keys(files[path]);
 output(names.length?names.join("    "):"(vacío)");
 break;
 }

 case "cd":{
 const path=resolve(args[0]||"~");
 if(!files[path]){
  output("Directorio no encontrado: "+path,"red");break;
 }
 cwd=path;
 break;
 }

 case "mkdir":{
 if(!args[0]){output("Uso: mkdir nombre","red");break;}
 const path=resolve(args[0]);
 if(files[path]){output("Ya existe.","red");break;}
 const p=parent(path);
 if(!files[p.folder]){output("Carpeta padre no encontrada.","red");break;}
 files[path]={};
 output("Carpeta creada: "+path,"green");
 break;
 }

 case "touch":{
 if(!args[0]){output("Uso: touch archivo","red");break;}
 const path=resolve(args[0]);
 const p=parent(path);
 if(!files[p.folder]){output("Carpeta padre no encontrada.","red");break;}
 if(files[p.folder][p.name]===undefined) files[p.folder][p.name]="";
 output("Archivo creado: "+path,"green");
 break;
 }

 case "cat":{
 if(!args[0]){output("Uso: cat archivo","red");break;}
 const path=resolve(args[0]);
 const p=parent(path);
 const value=files[p.folder]?.[p.name];
 if(typeof value!=="string"){output("Archivo no encontrado.","red");break;}
 output(value||"(archivo vacío)");
 break;
 }

 case "write":{
 if(args.length<2){output("Uso: write archivo contenido","red");break;}
 const path=resolve(args.shift());
 const p=parent(path);
 if(!files[p.folder]){output("Carpeta padre no encontrada.","red");break;}
 if(typeof files[p.folder][p.name]!=="string" &&
 files[p.folder][p.name]!==undefined){
 output("No es un archivo.","red");break;
 }
 files[p.folder][p.name]=args.join(" ");
 output("Contenido guardado.","green");
 break;
 }

 case "rm":{
 if(!args[0]){output("Uso: rm archivo","red");break;}
 const path=resolve(args[0]);
 const p=parent(path);
 if(typeof files[p.folder]?.[p.name]!=="string"){
 output("Archivo no encontrado.","red");break;
 }
 delete files[p.folder][p.name];
 output("Archivo eliminado.","green");
 break;
 }

 case "echo":
 output(args.join(" "));
 break;

 case "calc":{
 const expression=args.join("");
 if(!/^[0-9+\-*/().%\s]+$/.test(expression)){
 output("Operación no válida.","red");break;
 }
 const tokens=expression.match(/\d+(?:\.\d+)?|[()+\-*/%]/g)||[];
 if(tokens.join("")!==expression.replace(/\s/g,"")){
 output("Expresión incorrecta.","red");break;
 }
 const result=(function(){
 let i=0;
 function primary(){
  const t=tokens[i++];
  if(t==="-")return -primary();
  if(t==="+")return primary();
  if(t==="("){
   const v=add();
   if(tokens[i++]!==")")throw Error("Paréntesis incorrectos");
   return v;
  }
  const n=Number(t);
  if(!Number.isFinite(n))throw Error("Número incorrecto");
  return n;
 }
 function mul(){
  let v=primary();
  while(["*","/","%"].includes(tokens[i])){
   const op=tokens[i++],b=primary();
   if((op==="/"||op==="%")&&b===0)throw Error("División por cero");
   v=op==="*"?v*b:op==="/"?v/b:v%b;
  }
  return v;
 }
 function add(){
  let v=mul();
  while(tokens[i]==="+"||tokens[i]==="-"){
   const op=tokens[i++],b=mul();
   v=op==="+"?v+b:v-b;
  }
  return v;
 }
 const v=add();
 if(i!==tokens.length||!Number.isFinite(v))throw Error("Expresión incorrecta");
 return v;
 })();
 output("Resultado: "+result,"green");
 break;
 }

 case "tree":{
 const path=resolve(args[0]||".");
 if(!files[path]){output("Ruta no encontrada.","red");break;}
 function walk(obj,level){
  Object.entries(obj).forEach(([name,value])=>{
   output("  ".repeat(level)+"├── "+name+(typeof value==="object"?"/":""));
   if(typeof value==="object")walk(value,level+1);
  });
 }
 output(path);
 walk(files[path],1);
 break;
 }

 case "history":
 history.forEach((x,i)=>output((i+1)+"  "+x));
 break;

 case "clear":
 terminal.textContent="";
 break;

 default:
 output("Comando desconocido: "+cmd,"red");
 output("Escribe help para ver los comandos.","blue");
 }
 }catch(error){
 output("ERROR: "+error.message,"red");
 }
}

runButton.addEventListener("click",function(){
 const value=input.value;
 input.value="";
 execute(value);
 input.focus();
});

input.addEventListener("keydown",function(e){
 if(e.key==="Enter"){
  e.preventDefault();
  const value=input.value;
  input.value="";
  execute(value);
 }
 if(e.key==="ArrowUp"){
  e.preventDefault();
  if(historyPosition>0){
   historyPosition--;
   input.value=history[historyPosition];
  }
 }
 if(e.key==="ArrowDown"){
  e.preventDefault();
  if(historyPosition<history.length-1){
   historyPosition++;
   input.value=history[historyPosition];
  }else{
   historyPosition=history.length;
   input.value="";
  }
 }
});

document.querySelectorAll("[data-command]").forEach(button=>{
 button.addEventListener("click",function(){
  execute(button.dataset.command);
  input.focus();
 });
});

output("======================================","green");
output("       ALEX LINUX LAB 3.0","green");
output("       TERMINAL INICIADA","green");
output("======================================","green");
output("Usuario: alex");
output("Sistema: Linux virtual");
output("Escribe help para comenzar.","blue");

})();
</script>
</body>
</html>
