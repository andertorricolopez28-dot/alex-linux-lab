
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALEX LINUX LAB 5.1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050b08;color:#d9ffe5;font-family:monospace;padding:15px}
header{text-align:center;padding:20px}
h1{color:#00ff88;text-shadow:0 0 12px #00ff88}
.panel{max-width:900px;margin:15px auto;padding:15px;background:#0b1710;border:1px solid #17613a;border-radius:12px}
#terminal{height:380px;overflow:auto;background:#020604;padding:15px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:13px}
.green{color:#00ff88}.red{color:#ff7777}.blue{color:#69caff}
.inputrow{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;background:#020604;color:#00ff88;border:1px solid #17613a;padding:13px;font-family:monospace;border-radius:6px}
button{background:#07532b;color:#00ff88;border:1px solid #00a957;border-radius:6px;padding:12px;cursor:pointer;font-weight:bold}
button:active{background:#087c3d}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{font-size:12px}
</style>
</head>
<body>
<header>
<h1>ALEX LINUX LAB 5.1</h1>
<p>LABORATORIO LINUX VIRTUAL</p>
<p class="green">● SISTEMA INICIADO</p>
</header>

<div class="panel">
<h3 class="green">TERMINAL</h3>
<div id="terminal"></div>
<div class="inputrow">
<input id="command" placeholder="Escribe help..." autocomplete="off">
<button id="run">EJECUTAR</button>
</div>
<p style="font-size:11px;color:#83aa90">Pulsa ENTER para ejecutar.</p>
</div>

<div class="panel">
<h3 class="green">COMANDOS RÁPIDOS</h3>
<div class="quick">
<button data-cmd="help">HELP</button>
<button data-cmd="ls">LS</button>
<button data-cmd="pwd">PWD</button>
<button data-cmd="security">SECURITY</button>
<button data-cmd="nmap">NMAP</button>
<button data-cmd="ports">PORTS</button>
<button data-cmd="hash hola">HASH</button>
<button data-cmd="logs">LOGS</button>
<button data-cmd="firewall status">FIREWALL</button>
<button data-cmd="neofetch">NEOFETCH</button>
<button data-cmd="clear">CLEAR</button>
</div>
</div>

<script>
(()=>{
"use strict";

const terminal=document.getElementById("terminal");
const input=document.getElementById("command");
const runButton=document.getElementById("run");

let cwd="/home/alex";
let history=[];
let logs=[];
let firewallRules=["SSH: permitido","HTTP: permitido","TELNET: bloqueado"];
let files={
 "/":{type:"dir",mode:"755"},
 "/home":{type:"dir",mode:"755"},
 "/home/alex":{type:"dir",mode:"755"},
 "/home/alex/Documentos":{type:"dir",mode:"755"},
 "/home/alex/Descargas":{type:"dir",mode:"755"},
 "/home/alex/Escritorio":{type:"dir",mode:"755"},
 "/home/alex/Documentos/nota.txt":{type:"file",data:"Bienvenido a ALEX LINUX LAB 5.1",mode:"644"}
};

const portData=[
 {port:21,service:"FTP",state:"closed"},
 {port:22,service:"SSH",state:"open"},
 {port:23,service:"TELNET",state:"closed"},
 {port:80,service:"HTTP",state:"open"},
 {port:443,service:"HTTPS",state:"open"},
 {port:3306,service:"MYSQL",state:"closed"}
];

function out(s="",color=""){
 const d=document.createElement("div");
 d.textContent=String(s);
 if(color)d.className=color;
 terminal.appendChild(d);
 terminal.scrollTop=terminal.scrollHeight;
}
function log(s){logs.push(new Date().toLocaleTimeString()+" "+s);}
function pathOf(p){
 if(!p||p==="~")return "/home/alex";
 let a=p.startsWith("/")?[]:cwd.split("/").filter(Boolean);
 p.split("/").forEach(x=>{
  if(!x||x===".")return;
  if(x==="..")a.pop();else a.push(x);
 });
 return "/"+a.join("/");
}
function children(p){
 return Object.keys(files).filter(k=>{
  if(k===p)return false;
  let prefix=p==="/"?"/":p+"/";
  return k.startsWith(prefix)&&!k.slice(prefix.length).includes("/");
 });
}
function isDir(p){return files[p]?.type==="dir";}
function isFile(p){return files[p]?.type==="file";}

function help(){
 [
 "========== ALEX LINUX LAB 5.1 ==========",
 "ARCHIVOS:",
 "ls | pwd | cd | mkdir | touch | cat",
 "write | append | rm | rmdir | cp | mv | tree",
 "chmod 755 archivo.txt",
 "",
 "SEGURIDAD:",
 "security",
 "nmap [objetivo de laboratorio]",
 "hash texto",
 "ports",
 "firewall status",
 "firewall block PUERTO",
 "firewall allow PUERTO",
 "logs",
 "",
 "SISTEMA:",
 "whoami | id | hostname | uname -a",
 "date | uptime | ps | top | free | df | neofetch",
 "",
 "UTILIDADES:",
 "echo texto | calc 5+5 | seq 1 10",
 "history | clear | help",
 "",
 "Los análisis de red son simulaciones locales."
 ].forEach(x=>out(x,"green"));
}

async function sha256(text){
 const data=new TextEncoder().encode(text);
 const digest=await crypto.subtle.digest("SHA-256",data);
 return Array.from(new Uint8Array(digest))
 .map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function execute(raw){
 const line=raw.trim();
 if(!line)return;
 history.push(line);
 out("alex@linux:"+cwd+"$ "+line,"green");
 log("Comando: "+line);

 const args=line.match(/"[^"]*"|'[^']*'|\S+/g)||[];
 const cmd=args.shift().toLowerCase();
 const a=args.map(x=>x.replace(/^["']|["']$/g,""));

 try{
 switch(cmd){
 case "help":case "man":help();break;
 case "clear":case "cls":terminal.innerHTML="";break;
 case "pwd":out(cwd);break;
 case "whoami":out("alex");break;
 case "id":out("uid=1000(alex) gid=1000(alex) groups=1000(alex)");break;
 case "hostname":out("alex-linux-lab");break;
 case "uname":out(a.includes("-a")?"Linux alex-linux-lab 6.8.0-virtual x86_64 GNU/Linux":"Linux");break;
 case "date":out(new Date().toString());break;
 case "uptime":out("Sistema virtual activo.");break;
 case "neofetch":
 ["ALEX LINUX LAB 5.1","OS: Alex Linux Virtual","Kernel: 6.8.0-virtual","Usuario: alex","Seguridad: laboratorio aislado","Estado: OPERATIVO"].forEach(x=>out(x,"green"));break;

 case "ls":{
  let p=pathOf(a[0]||cwd);
  if(!isDir(p)){out("ls: carpeta no encontrada","red");break;}
  let names=children(p).map(k=>k.split("/").pop()+(isDir(k)?"/":""));
  out(names.length?names.join("   "):"Carpeta vacía");break;
 }
 case "cd":{
  let p=pathOf(a[0]||"~");
  if(isDir(p))cwd=p;else out("cd: carpeta no encontrada","red");
  break;
 }
 case "mkdir":{
  if(!a[0]){out("Uso: mkdir nombre");break;}
  let p=pathOf(a[0]),parent=p.slice(0,p.lastIndexOf("/"))||"/";
  if(files[p])out("Ya existe","red");
  else if(!isDir(parent))out("Carpeta padre no encontrada","red");
  else{files[p]={type:"dir",mode:"755"};out("Carpeta creada","green");}
  break;
 }
 case "touch":{
  if(!a[0]){out("Uso: touch archivo.txt");break;}
  let p=pathOf(a[0]),parent=p.slice(0,p.lastIndexOf("/"))||"/";
  if(!isDir(parent))out("Carpeta padre no encontrada","red");
  else{if(!files[p])files[p]={type:"file",data:"",mode:"644"};out("Archivo creado","green");}
  break;
 }
 case "cat":{
  let p=pathOf(a[0]);
  if(isFile(p))out(files[p].data);else out("Archivo no encontrado","red");
  break;
 }
 case "write":case "append":{
  if(a.length<2){out("Uso: "+cmd+" archivo.txt texto");break;}
  let p=pathOf(a[0]),parent=p.slice(0,p.lastIndexOf("/"))||"/";
  if(!isDir(parent)){out("Carpeta padre no encontrada","red");break;}
  if(cmd==="append"&&isFile(p))files[p].data+="\n"+a.slice(1).join(" ");
  else files[p]={type:"file",data:a.slice(1).join(" "),mode:"644"};
  out("Contenido guardado","green");break;
 }
 case "rm":{
  let p=pathOf(a[0]);
  if(isFile(p)){delete files[p];out("Archivo eliminado","green");}
  else out("Archivo no encontrado","red");
  break;
 }
 case "rmdir":{
  let p=pathOf(a[0]);
  if(!isDir(p)||p==="/"||p==="/home/alex"){out("Carpeta no válida","red");break;}
  if(children(p).length){out("Carpeta no vacía","red");break;}
  delete files[p];out("Carpeta eliminada","green");break;
 }
 case "cp":case "mv":{
  let src=pathOf(a[0]),dst=pathOf(a[1]);
  if(!isFile(src)||!a[1]){out("Uso: "+cmd+" origen destino","red");break;}
  let parent=dst.slice(0,dst.lastIndexOf("/"))||"/";
  if(!isDir(parent)){out("Destino no válido","red");break;}
  files[dst]={...files[src]};
  if(cmd==="mv")delete files[src];
  out(cmd==="cp"?"Archivo copiado":"Archivo movido","green");break;
 }
 case "tree":{
  function draw(p,n){
   children(p).forEach(k=>{
    out("  ".repeat(n)+"|-- "+k.split("/").pop());
    if(isDir(k))draw(k,n+1);
   });
  }
  out(cwd);draw(cwd,0);break;
 }
 case "chmod":{
  if(a.length<2){out("Uso: chmod 755 archivo.txt","red");break;}
  let p=pathOf(a[1]);
  if(!/^[0-7]{3,4}$/.test(a[0])){out("Permiso inválido","red");break;}
  if(!files[p])out("Archivo no encontrado","red");
  else{files[p].mode=a[0];out("Permisos actualizados: "+a[0],"green");log("Permisos "+a[0]+" en "+p);}
  break;
 }
 case "security":{
  out("ALEX SECURITY AUDIT 1.0","green");
  out("-----------------------------");
  out("[OK] Sistema virtual activo","green");
  let all=Object.keys(files);
  out("[OK] Elementos revisados: "+all.length);
  let writable=all.filter(p=>files[p].mode==="777");
  out(writable.length?"[!] Elementos con permiso 777: "+writable.length:"[OK] No hay permisos 777 detectados",writable.length?"red":"green");
  out("[OK] Directorios del laboratorio revisados","green");
  out("[OK] Firewall virtual: "+firewallRules.length+" reglas");
  out("RESULTADO: AUDITORÍA COMPLETADA","green");
  log("Auditoría de seguridad ejecutada");
  break;
 }
 case "nmap":{
  let target=a[0]||"lab.local";
  if(!/^(lab\.local|127\.0\.0\.1|localhost)$/.test(target)){
   out("Este laboratorio solo permite analizar lab.local o localhost.","red");break;
  }
  out("ALEX NMAP SIMULATOR");
  out("Objetivo: "+target);
  out("Escaneo de puertos simulado...");
  portData.forEach(p=>{
   let blocked=firewallRules.includes("BLOQUEAR:"+p.port);
   out(p.port+"/tcp "+(blocked?"filtered":p.state)+" "+p.service,
    blocked?"red":p.state==="open"?"green":"");
  });
  out("Escaneo virtual finalizado.","green");
  log("Escaneo simulado de "+target);
  break;
 }
 case "hash":{
  let value=a.join(" ");
  if(!value){out("Uso: hash texto");break;}
  if(a.length===1&&isFile(pathOf(a[0])))value=files[pathOf(a[0])].data;
  out("Calculando SHA-256...");
  out(await sha256(value),"blue");
  log("SHA-256 calculado");
  break;
 }
 case "ports":{
  out("PUERTOS DEL LABORATORIO VIRTUAL");
  portData.forEach(p=>{
   let blocked=firewallRules.includes("BLOQUEAR:"+p.port);
   out(p.port+"  "+p.service+"  "+(blocked?"BLOCKED":p.state));
  });
  break;
 }
 case "firewall":{
  if(a[0]==="status"){
   out("FIREWALL VIRTUAL","green");
   firewallRules.forEach(x=>out(x));
  }else if(a[0]==="block"||a[0]==="allow"){
   let port=Number(a[1]);
   if(!Number.isInteger(port)||port<1||port>65535){out("Uso: firewall block 22","red");break;}
   let rule="BLOQUEAR:"+port;
   firewallRules=firewallRules.filter(x=>!x.startsWith("BLOQUEAR:"+port));
   if(a[0]==="block")firewallRules.push(rule);
   out(a[0]==="block"?"Puerto "+port+" bloqueado en simulación":"Puerto "+port+" permitido en simulación","green");
   log("Firewall "+a[0]+" "+port);
  }else out("Uso: firewall status | firewall block 22 | firewall allow 22");
  break;
 }
 case "logs":
  out("REGISTRO DE ACTIVIDAD");
  logs.length?logs.forEach(out):out("No hay registros.");
  break;
 case "echo":out(a.join(" "));break;
 case "history":history.forEach((x,i)=>out((i+1)+" "+x));break;
 case "ps":case "top":
  ["PID  PROCESO","1    system","102  terminal","205  alex-shell","310  security-lab"].forEach(out);break;
 case "free":out("TOTAL: 4096 MB | USADO: 1250 MB | LIBRE: 2846 MB");break;
 case "df":out("DISCO VIRTUAL: 20 GB | USADO: 5 GB | LIBRE: 15 GB");break;
 case "ip":
  if(a[0]==="addr")out("lo: 127.0.0.1\neth0: 192.168.1.100/24");
  else if(a[0]==="route")out("default via 192.168.1.1 dev eth0");
  else out("Uso: ip addr | ip route");
  break;
 case "ping":
  out("PING "+(a[0]||"lab.local")+" (simulación)");
  out("64 bytes: tiempo=24 ms");
  out("64 bytes: tiempo=26 ms");
  out("3 paquetes transmitidos, 3 recibidos, 0% pérdida");
  break;
 case "calc":{
  let exp=a.join("");
  if(!exp||!/^[0-9+\-*/().% ]+$/.test(exp)){out("Expresión no válida","red");break;}
  try{
   let result=Function('"use strict";return ('+exp+')')();
   out(Number.isFinite(result)?result:"Resultado no válido");
  }catch(e){out("Error en cálculo","red");}
  break;
 }
 case "seq":{
  let start=a.length>1?Number(a[0]):1,end=Number(a.length>1?a[1]:a[0]);
  if(!Number.isInteger(start)||!Number.isInteger(end)||end<start||end-start>200){out("Uso: seq 1 10","red");break;}
  for(let i=start;i<=end;i++)out(i);
  break;
 }
 default:out("Comando no encontrado: "+cmd+". Escribe help.","red");
 }
 }catch(e){
  out("Error interno: "+e.message,"red");
 }
}

function run(){
 let v=input.value;
 if(!v.trim())return;
 execute(v);
 input.value="";
 input.focus();
}
runButton.addEventListener("click",run);
input.addEventListener("keydown",e=>{
 if(e.key==="Enter"){e.preventDefault();run();}
});
document.querySelectorAll("[data-cmd]").forEach(b=>{
 b.addEventListener("click",()=>{
  input.value=b.dataset.cmd;
  run();
 });
});

out("ALEX LINUX LAB 5.1 iniciado correctamente.","green");
out("Laboratorio virtual listo. Escribe help para comenzar.");

})();
</script>
</body>
</html>
